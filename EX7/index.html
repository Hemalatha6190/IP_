<!DOCTYPE html> 

<html> 

<head> 

    <meta charset="UTF-8"> 

    <title>Portal Login</title> 

    <style> 

        body { 

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 

            background: linear-gradient(135deg, #74b9ff, #a29bfe); 

            height: 100vh; 

            margin: 0; 

            display: flex; 

            justify-content: center; 

            align-items: center; 

        } 

        .login-card { 

            background: #fff; 

            padding: 40px; 

            border-radius: 12px; 

            box-shadow: 0 8px 24px rgba(0,0,0,0.15); 

            width: 100%; 

            max-width: 380px; 

        } 

        h2 { 

            text-align: center; 

            color: #2d3436; 

            margin-bottom: 25px; 

        } 

        .input-group { 

            margin-bottom: 20px; 

        } 

        label { 

            display: block; 

            margin-bottom: 8px; 

            color: #636e72; 

            font-weight: 600; 

            font-size: 14px; 

        } 

        input[type="text"], input[type="password"] { 

            width: 100%; 

            padding: 12px; 

            border: 1px solid #dfe6e9; 

            border-radius: 6px; 

            box-sizing: border-box; 

            font-size: 14px; 

            transition: border-color 0.3s; 

        } 

        input[type="text"]:focus, input[type="password"]:focus { 

            border-color: #0984e3; 

            outline: none; 

        } 

        button { 

            width: 100%; 

            background: #0984e3; 

            color: #fff; 

            border: none; 

            padding: 12px; 

            border-radius: 6px; 

            font-size: 16px; 

            font-weight: 600; 

            cursor: pointer; 

            transition: background 0.3s; 

        } 

        button:hover { 

            background: #74b9ff; 

        } 

        .hint { 

            font-size: 12px; 

            color: #b2bec3; 

            text-align: center; 

            margin-top: 15px; 

        } 

    </style> 

</head> 

<body> 

    <div class="login-card"> 

        <h2>Portal Login</h2> 

        <form action="WelcomeServlet" method="post"> 

            <div class="input-group"> 

                <label>Username</label> 

                <input type="text" name="uname" required placeholder="Enter username"> 

            </div> 

            <div class="input-group"> 

                <label>Password</label> 

                <input type="password" name="pwd" required placeholder="Enter password"> 

            </div> 

            <button type="submit">Login</button> 

        </form> 

        <div class="hint">Hint: Username: <b>admin</b> | Password: <b>123</b></div> 

    </div> 

</body> 

</html>
