<!DOCTYPE html>
<html>

<head>

    <title>QuickBuy - Cart</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: #264653;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .cart-box {
            width: 500px;
            max-width: 90%;
            background-color: white;
            margin: 50px auto;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
        }

        .cart-box h2 {
            color: #264653;
        }

        .button {
            display: inline-block;
            margin: 10px;
            padding: 12px 22px;
            background-color: #e76f51;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #d65a3a;
        }

    </style>

</head>

<body>

<header>

    <h1>QuickBuy</h1>

    <p>Shopping Cart</p>

</header>


<div class="cart-box">

    <h2>Your Cart</h2>

    <p>
        Your selected products are ready for checkout.
    </p>

    <a href="checkout.html" class="button">
        Checkout
    </a>

    <a href="products.html" class="button">
        Continue Shopping
    </a>

</div>

</body>

</html>
