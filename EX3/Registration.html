<!DOCTYPE html>
<html>
<head>
<title>Registration</title>
</head>

<body style="background-color:#FFF8DC; font-family:Arial;">

<center>

<h1 style="color:darkblue;">ONLINE SHOPPING SYSTEM</h1>

<h2 style="color:red;">User Registration</h2>

<hr width="80%">

<form action="Home.html">

<fieldset style="width:500px; border:3px solid blue; background:white;">

<legend style="color:blue; font-size:20px;"><b>Registration Form</b></legend>

<table cellpadding="10">

<tr>
<td><label><b>Full Name</b></label></td>
<td><input type="text" placeholder="Enter your name" required
style="padding:8px; width:220px;"></td>
</tr>

<tr>
<td><label><b>Email</b></label></td>
<td><input type="email" placeholder="Enter email" required
style="padding:8px; width:220px;"></td>
</tr>

<tr>
<td><label><b>Password</b></label></td>
<td><input type="password" placeholder="Create password" required
style="padding:8px; width:220px;"></td>
</tr>

<tr>
<td><label><b>Gender</b></label></td>
<td>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
</td>
</tr>

<tr>
<td><label><b>Mobile</b></label></td>
<td>
<input type="tel"
list="numbers"
placeholder="Enter Mobile Number"
style="padding:8px; width:220px;">
<datalist id="numbers">
<option value="9876543210">
<option value="9123456789">
<option value="9000000000">
</datalist>
</td>
</tr>

<tr>
<td><label><b>Category</b></label></td>
<td>
<select style="padding:8px; width:230px;">

<optgroup label="Fashion">
<option>Men</option>
<option>Women</option>
<option>Kids</option>
</optgroup>

<optgroup label="Electronics">
<option>Mobiles</option>
<option>Laptops</option>
<option>Smart Watches</option>
</optgroup>

</select>
</td>
</tr>

<tr>
<td><label><b>Address</b></label></td>
<td>
<textarea rows="4" cols="30"
placeholder="Enter Address"></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">

<input type="submit"
value="Register"
style="background:green; color:white; padding:10px 20px; border:none;">

<input type="reset"
value="Clear"
style="background:red; color:white; padding:10px 20px; border:none;">

</td>
</tr>

<tr>
<td colspan="2" align="center">

<br>

<a href="Login.html"
style="text-decoration:none; color:blue; font-weight:bold;">

Already have an account? Login

</a>

</td>
</tr>

</table>

</fieldset>

</form>

<br>

<p style="color:gray;">© 2026 Online Shopping System</p>

</center>

</body>
</html>
